name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single binary
        run: pyinstaller --onefile --clean --name eudic2maimemo --paths . --distpath dist packaging/entry.py

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar czf "eudic2maimemo-${{ matrix.target }}.tar.gz" eudic2maimemo

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path eudic2maimemo.exe -DestinationPath "eudic2maimemo-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，只构建不发版"
            ls -R artifacts
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
